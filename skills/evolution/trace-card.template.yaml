schema_version: 2
trace_id: "<goal-id>-trace"
goal_id: "<goal-id>"
started_at: "<iso8601>"
completed_at: "<iso8601>"

route:
  macro_route: "<skill-name>"
  selected_by: "routing_json|routing_md|manual_override"
  alternatives_considered:
    - route: "<skill-name>"
      reason_rejected: "<why not>"

steps:
  - step_id: 1
    prefix_summary: "<what is known before the step>"
    decision: "<next action>"
    route_or_tool: "<skill/tool>"
    command_or_action: "<reproducible command or MCP action>"
    evidence_observed: "<facts produced>"
    cost:
      tool_calls: 1
      elapsed_seconds: 0
    outcome: "progress" # progress|blocked|failed|oracle_passed|oracle_failed
    failure_mode: "<optional>"
    next_edge: "<continue|fallback skill|stop>"
    evidence_refs: [] # Records: id (unique, nonempty), source, input_id, coverage, limitations.


oracle_results:
  - oracle_id: "oracle-1"
    status: "not_run" # pass|fail|not_run; pass/fail require nonempty evidence_refs.
    evidence_refs: [] # IDs must resolve to this card's step evidence records.

unknowns: [] # Records: question, status (open|resolved), requires, affects_outcome (boolean),
             # supporting_evidence and contradicting_evidence (in-card evidence IDs).
             # Resolved unknowns need at least one supporting or contradicting ID.

learning:
  preserve:
    - "<successful action worth keeping>"
  repair:
    - "<failure mode and fix>"
  prune:
    - "<expensive action with no contribution>"

memory_tier: "candidate" # validated|candidate|forensic
promotion_candidate: false

plugins {
    id 'java'
}

group = 'com.burpmcp'
version = '2.0.0'
sourceCompatibility = '21'
targetCompatibility = '21'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2025.5'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.re2j:re2j:1.8'
}

// Montoya remains compile-only in production, but is needed to load the server in tests.
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath
}

tasks.register('schedulerRegressionTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.burpmcp.McpHttpServerSchedulerTest'
}

tasks.register('behaviorRegressionTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.burpmcp.McpHttpServerBehaviorTest'
}

tasks.register('httpHandlerRegressionTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.burpmcp.McpHttpHandlerRaceTest'
}

tasks.named('check') {
    dependsOn tasks.named('schedulerRegressionTest')
    dependsOn tasks.named('behaviorRegressionTest')
    dependsOn tasks.named('httpHandlerRegressionTest')
}

jar {
    manifest {
        attributes 'Implementation-Title': 'BurpMCP Full Control'
        attributes 'Implementation-Version': version
    }
    // Fat jar - include all dependencies
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = 'burp-mcp-full.jar'
}

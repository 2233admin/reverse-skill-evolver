name: Python CLI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip build ".[test]"

      - name: Test package CLI
        run: python -m pytest -q

      - name: Test compatibility entrypoints
        run: python -m unittest discover -s skills/scripts -p "test_*.py"

      - name: Run repository gates (Python only)
        run: python -m reverse_skill gates all

      - name: Run field-journal leak scan (Python only)
        run: python -m reverse_skill gates leak-scan

      - name: Build distributions
        run: python -m build

      - name: Verify packaged routing data
        run: >-
          python -c "import glob,zipfile;
          names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist();
          assert 'reverse_skill/data/routing.json' in names;
          assert 'reverse_skill/data/ida-plugin-capabilities.json' in names"
